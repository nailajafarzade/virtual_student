spring:
  application:
    name: virtual-student-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/vstudent
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

ai-service:
  base-url: http://localhost:8000

turn-audio:
  storage-dir: ./audio-storage